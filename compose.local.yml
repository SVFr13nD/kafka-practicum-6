x-broker: &broker
  image: apache/kafka:3.9.1
  environment: &broker_env
    CLUSTER_ID: '7NXIfdXjTbeT3VzLKQYIFw'
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    KAFKA_LOG_CLEANUP_POLICY: delete
    KAFKA_LOG_RETENTION_MS: 86400000
    KAFKA_LOG_SEGMENT_BYTES: 134217728
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  kafka-1:
    <<: *broker
    volumes: ["broker-1:/var/lib/kafka/data"]
    environment:
      <<: *broker_env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
  kafka-2:
    <<: *broker
    volumes: ["broker-2:/var/lib/kafka/data"]
    environment:
      <<: *broker_env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
  kafka-3:
    <<: *broker
    volumes: ["broker-3:/var/lib/kafka/data"]
    environment:
      <<: *broker_env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

volumes:
  broker-1:
  broker-2:
  broker-3:
