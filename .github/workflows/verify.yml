name: Test Kafka to Hadoop locally
on:
  push:
    branches: [main]
    paths-ignore: ['evidence/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Validate cloud configuration without creating resources
        run: |
          terraform -chdir=terraform fmt
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
      - name: Test real Kafka, Schema Registry and HDFS containers
        run: bash scripts/verify.sh local
      - name: Capture commands in a terminal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xterm xvfb xauth imagemagick fonts-dejavu-core
          xvfb-run -a -s '-screen 0 1800x1050x24' bash scripts/terminal-shots.sh
      - name: Capture real HDFS UI and execution report
        run: |
          pip install playwright==1.51.0
          playwright install --with-deps chromium
          python scripts/screenshots.py evidence/local
      - name: Record execution details
        if: always()
        run: |
          mkdir -p evidence/local
          printf 'Environment: GitHub Actions, NOT Yandex Cloud\nRun: https://github.com/%s/actions/runs/%s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > evidence/local/run.txt
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f compose.local.yml logs --no-color --tail 120
      - name: Publish verified results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/local terraform/main.tf terraform/.terraform.lock.hcl
          git commit -m 'Record local Kafka to HDFS test results [skip ci]'
          git push
      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.yml -f compose.local.yml down -v
